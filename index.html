    <img id="desktop-bg" src="assets/images/desktop-background.png" alt="Bureau Windows"/>
    <div id="icons" aria-hidden="false">
      <button class="icon" data-app="roblox" aria-label="Roblox">

        <span>Roblox</span>
      </button>
      <button class="icon" data-app="fortnite" aria-label="Fortnite">

      </button>
      <button class="icon" data-app="minecraft" aria-label="Minecraft">
        <img src="assets/images/icons/minecraft.png" alt="Minecraft"/>
        <span>Minecraft</span>
      </button>
      <button class="icon" data-app="discord" aria-label="Discord">
        <img src="assets/images/icons/discord.svg" alt="Discord"/>
        <span>Discord</span>
      </button>
      <button class="icon" data-app="reddit" aria-label="Reddit">
        <img src="assets/images/icons/reddit.svg" alt="Reddit"/>
        <span>Reddit</span>
      </button>
      <button class="icon" data-app="outlook" aria-label="Outlook">
        <img src="assets/images/icons/outlook.png" alt="Outlook"/>
        <span>Outlook</span>
      </button>
    </div>
  </div>

  <div id="app-window" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="titlebar">
      <span id="app-title">Application</span>
      <button id="close-window" aria-label="Fermer">✕</button>
    </div>
    <div id="app-content" tabindex="0"></div>
  </div>
